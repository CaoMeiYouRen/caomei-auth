name: Weekly Regression

on:
  schedule:
    # 每周一 UTC 1:00（北京时间 9:00）：在每周规划时段完整重跑一遍 release 前置全链路（不正式发布），
    # 并早于 release.yml 的周六发布窗口，形成"周初发现问题 → 周中修复 → 周末发布"的闭环。
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "告警门禁场景"
        type: choice
        required: true
        options:
          - weekly
          - release
        default: weekly

# 本工作流 = release.yml 发布前质量门（不含 semantic-release 与镜像推送）
# + docs / 重复代码 / 治理检查 + 安全告警门禁，用于周级回归与趋势监测。
permissions:
  contents: read
  issues: write
  security-events: read

concurrency:
  group: weekly-regression
  cancel-in-progress: false

jobs:
  # ── 安全告警门禁：critical 必须修复且不可豁免，high 需登记豁免 ────────────
  security:
    name: Security Alert Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 门禁口径见 docs/standards/security.md 的 5.1.3 节：critical 必须修复且不允许豁免；
      # high 默认阻塞，登记豁免（reason + tracking + expiresAt）后放行；medium / low 仅记录。
      # 脚本在无法完成扫描时 fail closed，不把"未扫描"当作"无告警"。
      - name: Check security alerts
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          node scripts/security/check-alerts.mjs \
            --scope="${{ inputs.scope || 'weekly' }}" \
            --report=security-alert-report.md \
            --json=security-alert-report.json

      - name: Upload alert report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-alert-report
          path: |
            security-alert-report.md
            security-alert-report.json
          if-no-files-found: warn
          retention-days: 30

      # 未通过时把最新结论写入固定追踪 Issue（首次自动创建），保证 high/critical 有据可查。
      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ ! -f security-alert-report.md ]; then
            echo "::warning title=追踪 Issue 未更新::本次未生成报告（可能为扫描失败），请查看 workflow 日志。"
            exit 0
          fi

          {
            echo "<!-- security-alert-gate -->"
            echo ""
            echo "> 本 Issue 由 Weekly Regression 的告警门禁自动维护（run: ${RUN_URL}）。修复后门禁恢复通过时会自动关闭。"
            echo ""
            cat security-alert-report.md
          } > issue-body.md

          existing="$(gh issue list --state open --search "安全告警追踪 in:title" \
            --json number,title --jq '.[] | select(.title | startswith("安全告警追踪")) | .number' | head -n 1)"

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file issue-body.md
            echo "已更新追踪 Issue #${existing}"
          else
            gh issue create --title "安全告警追踪：high / critical 未闭环" --body-file issue-body.md
          fi

      # 恢复通过后关闭追踪 Issue，避免历史 Issue 长期挂着失效结论。
      - name: Close tracking issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --state open --search "安全告警追踪 in:title" \
            --json number,title --jq '.[] | select(.title | startswith("安全告警追踪")) | .number' | head -n 1)"

          if [ -z "${existing}" ]; then
            exit 0
          fi

          gh issue comment "${existing}" --body "安全告警门禁已恢复通过（$(date -u +%Y-%m-%dT%H:%M:%SZ)），自动关闭。"
          gh issue close "${existing}"

  # ── 周级回归：与 release.yml 发布前质量门一致，另补静态检查与文档构建 ──────────
  regression:
    name: Release-equivalent Regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # postinstall 内执行 nuxt prepare，后续 lint / typecheck / build 依赖 .nuxt/ 生成物。
      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      # 以下步骤与 release.yml 的发布前质量门保持同一顺序与口径（差集：semantic-release、镜像推送）。
      - name: Lint JS/TS/Vue
        run: pnpm run lint

      - name: Lint styles
        run: pnpm run lint:css

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Check AI governance
        run: pnpm run ai:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Check duplicate code
        run: pnpm run lint:duplicate

      - name: Build docs
        run: pnpm run docs:build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload duplicate-code report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: duplicate-code-report
          path: |
            report/
            jscpd-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 周级回归结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 结论 | ${{ job.status }} |"
            echo ""
            echo "覆盖范围：release.yml 发布前质量门（除 semantic-release 与镜像推送）+ 安全告警门禁。"
          } >> "${GITHUB_STEP_SUMMARY}"
