name: Security Auto Fix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        options:
          - report-only
          - fix
          - fix-and-pr
        default: fix-and-pr
      severity-threshold:
        description: "严重级别阈值"
        type: choice
        required: false
        options:
          - critical
          - high
          - medium
          - all
        default: high
      dry-run:
        description: "试运行模式（不修改文件，仅在 fix 模式下生效）"
        type: boolean
        required: false
        default: false
      max-alerts-per-repository:
        description: "每仓库最多处理的告警数"
        type: string
        required: false
        default: "50"
      repos:
        description: "目标仓库列表（逗号分隔 owner/repo，留空默认使用当前仓库）"
        type: string
        required: false
        default: ""
      cleanup-branches-auto:
        description: "（fix-and-pr 模式）结束后自动删除已合并/已关闭的 dependfix 分支（非交互；不删有 open PR 的分支）"
        type: boolean
        required: false
        default: true
      commands:
        description: "自定义验证命令（逗号分隔；留空使用本仓库默认链：install + nuxt prepare + lint + typecheck + build）"
        type: string
        required: false
        default: ""
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）—— 早于人工 PR review 时段，构成"先自动修复 → 后人工复核"的时序闭环：
    # 修复 PR 合并后，后续任何 pnpm audit / dependabot recheck 的结果自然归零。
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  security-events: read

concurrency:
  group: security-auto-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependfix:
    name: Dependfix Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      security-events: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 前置校验：GH_TOKEN 是唯一能读取 Dependabot alerts 的凭据，且 fine-grained PAT 会过期。
      # 若 token 失效，dependfix 会以 401 结束并产出"0 条告警"的报告（run 40794773689），
      # 看起来像"扫描通过"，实为未扫描。这里先探测再进入扫描，避免误导性结论。
      - name: Validate GH_TOKEN
        env:
          GH_TOKEN_VALUE: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN_VALUE}" ]; then
            echo "::error title=GH_TOKEN 未配置::请在仓库 Settings → Secrets and variables → Actions 新增 GH_TOKEN（fine-grained PAT：Dependabot alerts: read，可选 Contents/Pull requests: write）。"
            exit 1
          fi

          # probe <path>：返回 HTTP 状态码；同时打印 GitHub 返回的 token 到期时间（若存在）。
          probe() {
            local path="$1" hdr code
            hdr="$(mktemp)"
            code="$(curl -sS -o /dev/null -D "${hdr}" -w '%{http_code}' \
              --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN_VALUE}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com${path}" 2>/dev/null)" || code="000"
            local expires
            expires="$(grep -i '^github-authentication-token-expiration:' "${hdr}" | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            if [ -n "${expires}" ]; then
              echo "::notice title=GH_TOKEN 到期时间::${expires}"
            fi
            rm -f "${hdr}"
            printf '%s' "${code}"
          }

          echo "GH_TOKEN is ${#GH_TOKEN_VALUE} chars"

          user_code="$(probe /user)"
          case "${user_code}" in
            200)
              echo "OK: GH_TOKEN 身份校验通过（GET /user 200）"
              ;;
            401)
              echo "::error title=GH_TOKEN 已失效::GET /user 返回 401，token 已过期、被撤销或值不正确。请重新生成 fine-grained PAT 并更新 Secret GH_TOKEN。"
              exit 1
              ;;
            *)
              echo "::error title=GH_TOKEN 校验异常::GET /user 返回 ${user_code}，请检查 token 与网络后重试。"
              exit 1
              ;;
          esac

          alerts_code="$(probe "/repos/${REPO}/dependabot/alerts?state=open&per_page=1")"
          case "${alerts_code}" in
            200)
              echo "OK: Dependabot alerts API 可访问（GET /repos/${REPO}/dependabot/alerts 200）"
              ;;
            401)
              echo "::error title=GH_TOKEN 已失效::Dependabot alerts API 返回 401，请重新生成 GH_TOKEN。"
              exit 1
              ;;
            403)
              echo "::error title=Dependabot alerts 权限不足::返回 403，GH_TOKEN 缺少 Dependabot alerts: read 权限，或该 token 无权访问本仓库。"
              exit 1
              ;;
            404)
              echo "::error title=Dependabot alerts 不可用::返回 404，仓库可能未启用 Dependabot alerts。请在 Settings → Code security 开启后重试。"
              exit 1
              ;;
            *)
              echo "::error title=Dependabot alerts 探测异常::返回 ${alerts_code}，请检查网络与仓库配置。"
              exit 1
              ;;
          esac

      - name: Run Dependfix Action
        # 引用外部 action 并钉 tag（v0.4.0），不追踪 master。
        # mode/severity 默认值按触发场景区分：
        #   - schedule：默认 report-only，仅产出 Markdown 报告归档，不创建 PR；
        #   - workflow_dispatch：默认 fix-and-pr，可由人工显式选择 report-only / fix。
        # severity-threshold 默认 high（聚焦 high+，与 security:alerts 的 --min-severity=high 口径对齐）。
        # Token 选型：与 CaoMeiYouRen/momei 兄弟仓及 dependfix/dependfix 上游保持同一模式——
        #   - github-token 优先 GH_TOKEN（fine-grained PAT，同时具备 Contents / Pull requests / Dependabot alerts 权限），
        #     缺省回退 GITHUB_TOKEN，避免 GH_TOKEN 缺失时整条 pipeline 瘫掉；
        #   - dependabot-alerts-token 显式指定 GH_TOKEN：GITHUB_TOKEN 永远无法读取 Dependabot alerts API（403），
        #     该 input 缺省回退 github-token，会复现 run 34728973736 的 403 失败。
        # 仓库 Settings → Secrets 需配置 GH_TOKEN（fine-grained PAT：Contents: Write、
        #   Pull requests: Write、Dependabot alerts: Read）。
        uses: dependfix/dependfix@v0.5.0
        with:
          mode: ${{ inputs.mode || (github.event_name == 'schedule' && 'report-only' || 'fix-and-pr') }}
          severity-threshold: ${{ inputs.severity-threshold || 'high' }}
          dry-run: ${{ inputs.dry-run || 'false' }}
          max-alerts-per-repository: ${{ inputs.max-alerts-per-repository || '50' }}
          repos: ${{ inputs.repos || '' }}
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          dependabot-alerts-token: ${{ secrets.GH_TOKEN }}
          cleanup-branches-auto: ${{ inputs.cleanup-branches-auto || 'true' }}
          # caomei-auth 验证链：Nuxt 4 单包项目（非 monorepo），无 workspace 子包；
          # lint/typecheck 依赖 .nuxt/tsconfig.json（nuxt prepare 生成物），故在 install 后显式 prepare；
          # lint 带 --fix（修复分支上产生的格式化改动随 PR 一并提交）。
          # 与现有 test.yml / docker.yml 风格对齐（pnpm i + pnpm run 前缀）。
          commands: ${{ inputs.commands || 'pnpm i --frozen-lockfile, pnpm exec nuxt prepare, pnpm run lint, pnpm run typecheck, pnpm run build' }}
