name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:css
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

  # 镜像发布即生产发布：推送 latest / sha-* 并触发 Jenkins 部署前必须通过安全告警门禁
  # （docs/standards/security.md 5.1.3）。critical 不允许豁免，high 需按类别登记豁免；
  # 扫描含 dismissed。Dependabot 用 GH_TOKEN，Code scanning 用 GITHUB_TOKEN + security-events: read。
  gate:
    name: Security alert gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Security alert gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODE_SCANNING_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/security/check-alerts.mjs \
            --scope=release \
            --report=security-alert-report.md \
            --json=security-alert-report.json

  # 原生多架构构建由 docker-build.yml 复用工作流承担：amd64 / arm64 分别在
  # 对应架构的 runner 上构建，按 digest 推送后在 merge 作业合成 manifest。
  docker:
    name: Docker
    needs:
      - test
      - gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ github.sha }}
      images: |
        ${{ github.repository }}
        ghcr.io/${{ github.repository }}
        registry.cn-hangzhou.aliyuncs.com/${{ github.repository }}
      latest: true
      date-tag: true
      sha-tag: true
      cache-scope-prefix: caomei-auth
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Get short commit hash
        run: echo "TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}
      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: ${{ github.repository }}
          description: "草梅Auth是一个基于Nuxt全栈框架的统一登录平台"
      - name: Deploy to Jenkins
        if: ${{ github.repository == 'CaoMeiYouRen/caomei-auth' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_TOKEN }} "${{ secrets.JENKINS_URL }}/buildWithParameters?token=${{ secrets.JENKINS_JOB_TOKEN }}&DOCKER_IMAGE=registry.cn-hangzhou.aliyuncs.com/${{ env.REPO }}:${{ env.TAG }}"
      - name: Deploy Demo to Jenkins
        if: ${{ github.repository == 'CaoMeiYouRen/caomei-auth' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_DEMO_TOKEN }} "${{ secrets.JENKINS_DEMO_URL }}/buildWithParameters?token=${{ secrets.JENKINS_DEMO_JOB_TOKEN }}&DOCKER_IMAGE=${{ env.REPO }}:${{ env.TAG }}"
