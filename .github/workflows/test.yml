name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:css
      - run: pnpm run ai:check
      - run: pnpm run migration:check-imports
      - run: pnpm run i18n:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run migration:check-budget
      - run: pnpm run test
      - run: pnpm run test:coverage

      # 上传代码覆盖率报告到 Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

        # 检查代码重复率
      - run: pnpm run lint:duplicate

  # ===============================================================
  # 视觉回归门禁（Visual Regression）
  #
  # 为什么在容器里跑：视觉比对是像素级判定，宿主与 runner 的字体集合 / fontconfig
  # 不同会造成约 1% 的整页漂移（本地 WSL2 vs 容器实测 12,509 / 1,296,000 px）。
  # 因此渲染环境固定为 Playwright 官方镜像，本地采集与 CI 判定同源。
  #
  # - 自基线（tests/visual/__screenshots__）是阻断门禁；
  # - 参考态快照（tests/visual/reference）自 P5 起仅作历史证据，CI 不再执行 parity；
  #   自基线是唯一阻断视觉门禁。
  # ===============================================================
  visual:
    name: Visual Regression
    needs: [test]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: npm i -g pnpm@11.17.0
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Build Nuxt
        run: pnpm run build
      - name: Visual baseline gate
        run: pnpm run test:visual:raw
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: |
            test-results/visual/
            playwright-report/visual/
          retention-days: 7
          if-no-files-found: ignore
