name: Release
on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:
  schedule:
    # 每周六 UTC+0 12:00 即 UTC+8 20:00
    - cron: "0 12 * * 6"
# 仅针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Release 作业不取消，因为要确保版本发布成功
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      packages: write
      contents: write
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      # 发布前安全告警门禁（docs/standards/security.md 5.1.3）：
      # critical 必须修复且不允许豁免；high 默认阻塞，需在 .github/security-alert-exemptions.json 登记豁免；
      # medium / low 仅记录。读取 Dependabot alerts 只能使用 GH_TOKEN（GITHUB_TOKEN 恒为 403）。
      - name: Security alert gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node scripts/security/check-alerts.mjs \
            --scope=release \
            --report=security-alert-report.md \
            --json=security-alert-report.json
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:css
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release
      # 发布到 docker
      - name: Get git tag
        run: |
          GIT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "GIT_TAG=$GIT_TAG" >> ${GITHUB_ENV}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # 发布到 docker.io / ghcr.io / registry.cn-hangzhou.aliyuncs.com
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
            registry.cn-hangzhou.aliyuncs.com/${{ github.repository }}
          tags: |
            type=semver,priority=1100,pattern={{version}},value=${{env.GIT_TAG}},enable=true
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
          flavor: latest=false
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        # 如果有 GIT_TAG ，就发布
        if: ${{ env.GIT_TAG }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # 阿里云 ACR 个人版拒绝 provenance/sbom 使用的 OCI 空 manifest（application/vnd.oci.empty.v1+json），关闭 attestation
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
