name: Release
on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:
  schedule:
    # 每周六 UTC+0 12:00 即 UTC+8 20:00
    - cron: "0 12 * * 6"
# 仅针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Release 作业不取消，因为要确保版本发布成功
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: read
    outputs:
      git_tag: ${{ steps.tag.outputs.git_tag }}
      version: ${{ steps.tag.outputs.version }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      # 发布前安全告警门禁（docs/standards/security.md 5.1.3）：
      # 扫描 open + dismissed；critical 必须修复且不允许豁免；high 默认阻塞，需按类别登记豁免；
      # medium / low 仅记录。Dependabot alerts 只能使用 GH_TOKEN（GITHUB_TOKEN 恒为 403），
      # Code scanning 使用 workflow 的 GITHUB_TOKEN + security-events: read。
      - name: Security alert gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODE_SCANNING_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/security/check-alerts.mjs \
            --scope=release \
            --report=security-alert-report.md \
            --json=security-alert-report.json
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:css
      - run: pnpm run i18n:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run migration:check-budget
      - run: pnpm run test
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release
      # 发布到 docker：拆到独立复用工作流（原生 amd64 / arm64），不再使用 QEMU
      - name: Get git tag
        id: tag
        run: |
          GIT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "git_tag=$GIT_TAG" >> ${GITHUB_OUTPUT}
          echo "version=${GIT_TAG#v}" >> ${GITHUB_OUTPUT}
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> ${GITHUB_OUTPUT}

  docker:
    name: Docker
    needs: release
    if: ${{ needs.release.outputs.git_tag != '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: refs/tags/${{ needs.release.outputs.git_tag }}
      images: |
        ${{ github.repository }}
        ghcr.io/${{ github.repository }}
        registry.cn-hangzhou.aliyuncs.com/${{ github.repository }}
      version: ${{ needs.release.outputs.version }}
      latest: true
      date-tag: true
      sha-tag: true
      sha: ${{ needs.release.outputs.short_sha }}
      cache-scope-prefix: caomei-auth
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
