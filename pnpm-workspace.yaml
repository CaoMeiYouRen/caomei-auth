allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  sqlite3: true
  unrs-resolver: true
  vue-demi: true

# 临时豁免 file-type@22.0.2（2026-08-15 01:47 UTC 发布，未满 minimumReleaseAge 24h）。
# 背景：Dependabot 解析 lockfile 时会引入 22.0.2，导致 CI 的 supply-chain 检查失败。
# 移除条件：2026-08-16 01:47 UTC 之后（满 24h）可删除本段。
minimumReleaseAgeExclude:
  - file-type@22.0.2

# @nuxt/test-utils@4.1.0 的 setupNuxt 在测试文件 mock `#app/nuxt`（如 useRuntimeConfig）
# 时，nuxtApp 未完整初始化导致 useRouter()/nuxtApp._route 为空而崩溃。
# patch 内容：useRouter()?.afterEach + sync() 内 _route 判空。
# 移除条件：上游发布修复版本（>=4.1.1）后删除本段与 patches/ 文件，
# 并同步移除 Dockerfile 第 10 行 COPY 指令中的 patches/。
patchedDependencies:
  '@better-auth/utils@0.4.2': patches/@better-auth__utils@0.4.2.patch
  "@nuxt/test-utils@4.1.0": patches/@nuxt-test-utils@4.1.0.patch

